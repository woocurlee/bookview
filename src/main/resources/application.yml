spring:
  application:
    name: bookview

  data:
    mongodb:
      auto-index-creation: true # 도메인 @Indexed/@CompoundIndex를 앱 시작 시 생성

  thymeleaf:
    cache: false # 개발 시 템플릿 자동 새로고침

app:
  base-url: http://localhost:8080
  rate-limit:
    review-create:
      limit: 5
      window: 10m
    review-update:
      limit: 10
      window: 1m
    comment-create:
      limit: 5
      window: 1m
